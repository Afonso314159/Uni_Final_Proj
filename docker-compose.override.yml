services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env.local
    volumes:
      - .:/app:z
      - staticfiles:/app/staticfiles
      - media:/app/media

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.local
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  worker:
      build: .
      restart: unless-stopped
      command: celery -A config worker -l info
      depends_on:
        - db
        - redis
      env_file:
        - .env.local
      volumes:
        - .:/app:z

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - db
      - redis
    env_file:
      - .env.local
    volumes:
      - .:/app:z

volumes:
  db_data:
  staticfiles:
  media: