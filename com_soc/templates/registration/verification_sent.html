{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ENIDH Comunicação Social</title>
    <link rel="stylesheet" href="{% static 'com_soc/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'com_soc/css/auth.css' %}">
</head>

<body class="auth-page">
    <header>
        <a href="{% url 'landing_page' %}" class="logo">ENIDH - <span>Comunicação Social</span></a>
        <a href="{% url 'landing_page' %}" class="back-btn">← Voltar</a>
    </header>
  
<main class="auth-main">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-icon auth-icon--success">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
        </svg>
      </div>
      <h1 class="auth-title">Verifica o teu email</h1>
      <p class="auth-subtitle">
        Enviámos um link de verificação para <strong>{{ email }}</strong>.<br>
        Clica no link para ativares a tua conta.
      </p>
      <p class="auth-note">Não recebeste nada? Verifica a pasta de spam.</p>
    </div>
  </div>
</main>

</body>
</html>
