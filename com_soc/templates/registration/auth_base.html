{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ENIDH Comunicação Social{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'com_soc/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'com_soc/css/auth.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="auth-page">
    <header>
        <a href="{% url 'landing_page' %}" class="logo">ENIDH - <span>Comunicação Social</span></a>
        <a href="{% url 'landing_page' %}" class="back-btn">← Voltar</a>
    </header>

    <main class="auth-main">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
