{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ENIDH Comunicação Social</title>
    <link rel="stylesheet" href="{% static 'com_soc/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'com_soc/css/auth.css' %}">
</head>

<body class="auth-page">
    <header>
        <a href="{% url 'landing_page' %}" class="logo">ENIDH - <span>Comunicação Social</span></a>
        <a href="{% url 'landing_page' %}" class="back-btn">← Voltar</a>
    </header>
  
<main class="auth-main">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-icon auth-icon--success">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="auth-title">Password alterada</h1>
      <p class="auth-subtitle">A tua password foi atualizada com sucesso. Já podes fazer login.</p>
      <a href="{% url 'login' %}" class="auth-btn">Ir para o login</a>
    </div>
  </div>
</main>

</body>
</html>
