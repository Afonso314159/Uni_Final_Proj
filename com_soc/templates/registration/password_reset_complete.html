{% extends "registration/auth_base.html" %}

{% block title %}Password Alterada - ENIDH Comunicação Social{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon auth-icon--success">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1 class="auth-title">Password alterada</h1>
        <p class="auth-subtitle">A tua password foi atualizada com sucesso. Já podes fazer login.</p>
        <a href="{% url 'login' %}" class="auth-btn">Ir para o login</a>
    </div>
</div>
{% endblock %}
