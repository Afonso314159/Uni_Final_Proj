{% extends "com_soc/base.html" %}
{% load static %}

{% block content %}
{% with empty_state_msg="Não há notícias exclusivas de momento." show_include_public=True %}
    {% include "com_soc/includes/news_feed_content.html" %}
{% endwith %}

<!-- Chat FAB -->
<button class="chat-fab" id="chat-fab" title="Chat Room" aria-label="Abrir chat">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
    </svg>
</button>

<div id="chat-modal" class="modal-overlay" data-username="{{ request.user.username }}">
    <div class="modal chat-modal">
        <div class="modal-header">
            <div class="modal-header-left">
                <h2>Chat Room</h2>
                <span id="chat-online-count" class="chat-online-count"></span>
            </div>
            <button class="modal-close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="modal-body chat-modal-body">
            <div id="chat-messages" class="chat-messages"></div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" class="chat-input" placeholder="Escreve uma mensagem..." maxlength="500" autocomplete="off">
            <button id="chat-send" class="chat-send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'com_soc/js/news_filter.js' %}"></script>
<script src="{% static 'com_soc/js/subscriber.js' %}"></script>
{% endblock %}
