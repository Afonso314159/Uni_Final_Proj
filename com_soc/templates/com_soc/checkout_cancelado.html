{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Cancelado - ENIDH Comunicação Social</title>
    <link rel="stylesheet" href="{% static 'com_soc/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'com_soc/css/checkout_result.css' %}">
</head>

<body>
    <header>
        <a href="{% url 'landing_page' %}" class="logo">ENIDH - <span>Comunicação Social</span></a>
        <a href="{% url 'landing_page' %}" class="back-btn">← Início</a>
    </header>

    <main>
        <div class="result-card">
            <div class="result-icon result-icon--cancel">×</div>
            <h1 class="result-title">Pagamento cancelado</h1>
            <p class="result-subtitle">
                Não foi processado nenhum pagamento.<br>
                Podes tentar novamente quando quiseres.
            </p>
            <a href="{% url 'subscricao' %}" class="result-btn">Voltar aos planos</a>
        </div>
    </main>
</body>
</html>
